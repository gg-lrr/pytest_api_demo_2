name: Pytest接口自动化 - Allure报告流水线
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: 安装依赖包（包含allure-pytest）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 安装Allure命令行（ubuntu云端预装allure）
      - name: 安装 Allure Commandline
        uses: simple-elf/allure-report-action@master
        with:
          allure_version: 2.29.0

      - name: 执行自动化用例，生成allure原始结果
        run: |
          export PYTHONPATH=$PWD
          mkdir -p allure-results
          pytest cases/ --alluredir=allure-results

      # 生成静态allure网页报告
      - name: 生成Allure静态报告
        run: |
          allure generate allure-results -o allure-report --clean

      # 上传完整allure静态报告，流水线结束后下载
      - name: 上传Allure报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-test-report
          path: allure-report
name: Pytest进阶接口自动化流水线
# 触发规则：往main分支推送代码、提交PR，自动执行流水线
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  run-test:
    runs-on: ubuntu-latest # GitHub云端分配一台临时Ubuntu机器执行
    steps:
      # 步骤1：拉取仓库代码到云端服务器
      - name: 拉取代码
        uses: actions/checkout@v4

      # 步骤2：安装Python3.11，缓存pip包，加速下次运行
      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14
          "
          cache: pip

      # 步骤3：升级pip，安装项目依赖
      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 步骤4：执行pytest，生成独立HTML报告
      - name: 执行自动化用例
        run: |
          pytest cases/ --html=report/report.html --self-contained-html

      # 步骤5：上传报告
      # if: always() 重点！无论用例成功/失败，都上传报告
      - name: 上传HTML报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report/report.html